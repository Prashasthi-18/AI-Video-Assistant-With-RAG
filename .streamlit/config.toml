[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#07070D"
secondaryBackgroundColor = "#11111B"
textColor = "#E6E6F0"

[server]
maxUploadSize = 2048
# The auto-reload watcher crawls every module of `transformers` and logs hundreds of harmless
# "No module named torchvision" tracebacks. Turn it off (restart the app after code changes).
fileWatcherType = "none"

[client]
toolbarMode = "minimal"
